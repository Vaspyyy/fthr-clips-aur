name: Validate and publish one AUR package
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      tools:
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch tools
        env:
          ARCH_TOOLS: ${{ inputs.tools }}
        run: pacman -Syu --noconfirm --needed $ARCH_TOOLS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate trusted main without AUR credentials
        env:
          PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          if [[ "$PACKAGE" == fthr-clips-git ]]; then
            bash maintenance/bootstrap-git-deps.sh
          fi
          runuser -u builder -- bash maintenance/validate.sh "$PACKAGE"
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Publish source recipe using dedicated AUR identity
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PACKAGE: ${{ inputs.package }}
        run: bash maintenance/publish-aur.sh "$PACKAGE"
