name: Package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: fthr-clips-bin
            tools: git python squashfs-tools namcap desktop-file-utils glibc zlib libglvnd libdrm libxcb wayland
          - package: fthr-clips-git
            tools: git python namcap desktop-file-utils pyside6 qt6-multimedia python-numpy python-opencv libpipewire dbus glibc gcc-libs libpulse wayland ca-certificates licenses patchelf cmake pkgconf python-installer python-packaging python-setuptools python-build python-wheel python-pytest python-pytest-qt python-typing_extensions
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch tools
        env:
          ARCH_TOOLS: ${{ matrix.tools }}
        run: pacman -Syu --noconfirm --needed $ARCH_TOOLS
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate as unprivileged user
        env:
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          if [[ "$PACKAGE" == fthr-clips-git ]]; then
            bash maintenance/bootstrap-git-deps.sh
          fi
          runuser -u builder -- bash maintenance/validate.sh "$PACKAGE"
