name: Check moving Git branch
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-branch-build
  cancel-in-progress: false
jobs:
  build:
    # Opt in to daily builds with repository variable ENABLE_DAILY_GIT_BUILD=true.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_GIT_BUILD == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Arch tools
        run: pacman -Syu --noconfirm --needed git python namcap desktop-file-utils pyside6 qt6-multimedia python-numpy python-opencv glibc gcc-libs libpulse wayland ca-certificates licenses patchelf cmake pkgconf python-installer python-packaging python-setuptools python-build python-wheel python-pytest python-pytest-qt
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Build current upstream without changing or publishing metadata
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          bash maintenance/bootstrap-git-deps.sh
          runuser -u builder -- bash maintenance/validate.sh fthr-clips-git
