name: Publish reviewed packages to AUR
on:
  push:
    branches: [main]
    paths: ['packages/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-aur
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: fthr-clips-bin
            tools: git python squashfs-tools namcap desktop-file-utils glibc zlib libglvnd libdrm libxcb wayland
          - package: fthr-clips-git
            tools: git python namcap desktop-file-utils pyside6 qt6-multimedia python-numpy python-opencv libpipewire dbus glibc gcc-libs libpulse wayland ca-certificates licenses patchelf cmake pkgconf python-installer python-packaging python-setuptools python-build python-wheel python-pytest python-pytest-qt python-typing_extensions
    uses: ./.github/workflows/publish-package.yml
    with:
      package: ${{ matrix.package }}
      tools: ${{ matrix.tools }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
